apiVersion: apps/v1
kind: Deployment
metadata:
  name: courses-api
  namespace: courses
  labels:
    app: courses-api
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: courses-api
  template:
    metadata:
      labels:
        app: courses-api
    spec:
      imagePullSecrets:
        - name: ecr-pull
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
      containers:
        - name: courses-api
          image: 275061641109.dkr.ecr.us-east-1.amazonaws.com/devops-chair/courses-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: courses-config
            - secretRef:
                name: courses-api
            - secretRef:
                name: courses-google
                optional: true
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: courses-api
  namespace: courses
spec:
  selector:
    app: courses-api
  ports:
    - name: http
      port: 80
      targetPort: 3001
