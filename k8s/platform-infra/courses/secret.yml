# Postgres/session only. Do not put Google OAuth in this Secret: Argo CD
# self-heals it from git (replace-me). Create a cluster-only Secret:
#
# kubectl -n courses create secret generic courses-google \
#   --from-literal=GOOGLE_CLIENT_ID='....apps.googleusercontent.com' \
#   --from-literal=GOOGLE_CLIENT_SECRET='GOCSPX-...' \
#   --dry-run=client -o yaml | kubectl apply -f -
# kubectl -n courses rollout restart deploy/courses-api
apiVersion: v1
kind: Secret
metadata:
  name: courses-api
  namespace: courses
type: Opaque
stringData:
  POSTGRES_USER: academia
  POSTGRES_PASSWORD: academia
  POSTGRES_DB: academia
  DATABASE_URL: postgresql://academia:academia@postgres.courses.svc.cluster.local:5432/academia
  SESSION_SECRET: change-me-courses-session-secret
  WEB_ORIGIN: https://courses-iamlesanpi.beops.app
  GOOGLE_CALLBACK_URL: https://courses-api-iamlesanpi.beops.app/auth/google/callback
