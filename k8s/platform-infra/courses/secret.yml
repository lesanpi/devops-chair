# Do not put real Google OAuth values in git. Create/patch them in-cluster:
# kubectl -n courses create secret generic courses-api \
#   --from-literal=POSTGRES_USER=academia \
#   --from-literal=POSTGRES_PASSWORD=academia \
#   --from-literal=POSTGRES_DB=academia \
#   --from-literal=DATABASE_URL='postgresql://academia:academia@postgres.courses.svc.cluster.local:5432/academia' \
#   --from-literal=SESSION_SECRET='replace-me' \
#   --from-literal=GOOGLE_CLIENT_ID='...' \
#   --from-literal=GOOGLE_CLIENT_SECRET='...' \
#   --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: courses-api
  namespace: courses
type: Opaque
stringData:
  POSTGRES_USER: academia
  POSTGRES_PASSWORD: academia
  POSTGRES_DB: academia
  DATABASE_URL: postgresql://academia:academia@postgres.courses.svc.cluster.local:5432/academia
  SESSION_SECRET: change-me-courses-session-secret
  GOOGLE_CLIENT_ID: replace-me
  GOOGLE_CLIENT_SECRET: replace-me
