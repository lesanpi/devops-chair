name: 'Ansible'

on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'Write "yes" to confirm deployment'
        required: true
        default: 'no'

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: 'us-east-1'

jobs:
  ansible-apply:
    name: 'Ansible Apply'
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirmacion == 'yes' }}
    defaults:
      run:
        working-directory: ./ansible

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Ansible y Boto3 (Para inventario dinámico AWS)
        run: |
          python -m pip install --upgrade pip
          pip install ansible boto3 botocore

      - name: 'Install AWS Session Manager Plugin'
        run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb
          session-manager-plugin --version

      - name: 'Validate Dynamic Inventory'
        run: ansible-inventory -i aws_ec2.yml --graph

      - name: 'Run Ansible'
        run: ansible-playbook site.yml
