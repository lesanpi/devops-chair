name: 'Ansible'

on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'Write "yes" to confirm deployment'
        required: true
        default: 'no'

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: 'us-east-1'

jobs:
  ansible-apply:
    name: 'Ansible Apply'
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirmacion == 'yes' }}
    defaults:
      run:
        working-directory: ./ansible

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Configure Python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 'Configure AWS Credentials'
        run: |
          aws configure set aws_access_key_id ${{ env.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws configure set region ${{ env.AWS_REGION }}

      - name: 'Install Ansible and Boto3 (For dynamic inventory AWS)'
        run: |
          python -m pip install --upgrade pip
          pip install ansible boto3 botocore

      - name: 'Install Ansible AWS Collection'
        run: |
          ansible-galaxy collection install amazon.aws

      - name: 'Install AWS Session Manager Plugin'
        run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb
          session-manager-plugin --version

      - name: Validate Dynamic Inventory Ansible
        working-directory: .
        run: |
          ansible-inventory -i ansible/inventory/aws_ec2.yml --graph
          test -n "$(ansible-inventory -i ansible/inventory/aws_ec2.yml --list | python -c 'import json,sys; d=json.load(sys.stdin); print("".join(d.get("_meta",{}).get("hostvars",{})))')"

      - name: 'Run Ansible'
        run: ansible-playbook site.yml -i ansible/inventory/aws_ec2.yml
