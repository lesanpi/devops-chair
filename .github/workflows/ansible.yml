name: 'Ansible'

on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'Write "yes" to confirm deployment'
        required: true
        default: 'no'

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: 'us-east-1'

jobs:
  ansible-apply:
    name: 'Ansible Apply'
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirmacion == 'yes' }}
    defaults:
      run:
        working-directory: ./ansible

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Install Ansible'
        uses: ansible/ansible@v4
        with:
          ansible_version: '8.0.0'

      - name: 'Run Ansible'
        run: ansible-playbook site.yml
